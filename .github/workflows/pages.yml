name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false # let a running deploy finish (GitHub's Pages starter workflow does the same)

jobs:
  # Unit tests and the i18n checks gate the deploy: a failing check never reaches the live site.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Unit tests (data checks that need data/raw skip)
        run: uv run python -m unittest discover -s tests
      - name: i18n checks
        run: |
          node tools/i18n/check_dups.mjs
          python3 tools/i18n/gen.py
          git diff --exit-code web/js/i18n/vi-data.js # the committed dictionary is the generated one
          node tools/check_format.mjs vi
          node tools/check_format.mjs en
      - name: JS syntax
        run: find web/js -name '*.js' -print0 | xargs -0 -n1 node --check

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Source zip for the in-app help link
        run: git archive --format=zip --prefix=vnciv/ -o web/vnciv-source.zip HEAD
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  # A separate job (GitHub's starter layout): deploying in the same job as the upload sometimes found no artifact yet.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
