<body>
  <header id="topbar">
    <div class="brand" title="Việt Nam"><svg class="brand-emblem" aria-hidden="true" viewBox="0 0 30 20" width="27" height="18"><rect width="30" height="20" fill="#DA251D"/><polygon fill="#FFFF00" points="15,4 16.35,8.15 20.71,8.15 17.18,10.71 18.53,14.85 15,12.29 11.47,14.85 12.82,10.71 9.29,8.15 13.65,8.15"/></svg><span class="brand-text">Việt Nam</span></div>
    <div id="yields" class="yields" role="group" aria-label="National yields"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Search places, communes and provinces (/ or Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <!-- Extension buttons, the "More ▾" menu (addTopButton({menu: true}), Share) and the Author mark scroll with the
         bar on phones; .tb-buttons stays pinned. -->
    <div class="tb-more">
      <div class="tb-menu">
        <button id="btn-more" class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tb-menu-list"></button>
        <div id="tb-menu-list" class="panel tb-menu-list" role="menu" aria-labelledby="btn-more" hidden>
          <button id="btn-share" class="btn" role="menuitem" aria-haspopup="dialog" aria-expanded="false" aria-label="Share this view" title="Share: copy a link or download an image"></button>
        </div>
      </div>
    </div>
    <div class="tb-buttons">
      <button id="btn-lang" class="btn" aria-label="Language"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Keyboard and mouse help" title="Help (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Open the Almanac" title="What every number means and where it comes from"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="Hex map of Vietnam" tabindex="-1"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Details"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Map"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Lens legend"></div>
    <!-- The bottom row: the "Map" button on the right, the year bar (ext/timeline fills #turn) centred in the rest;
         when the row is too narrow (phones, open panels) the year bar wraps above the dock. -->
    <div id="dock-row">
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Map lenses">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resources on tiles (R)" title="Show or hide resources on tiles (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
      <!-- phones only (CSS): in the dock, so a legend, sea-level panel or replay bar never covers it -->
      <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Show the minimap"></button>
    </div>
    <div id="turn" class="turn panel" role="group" aria-label="Timeline"></div>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimap: click to jump" role="img"></canvas><div id="map-attrib" class="map-attrib">© OpenStreetMap contributors · Natural Earth · OCHA COD-AB · <a href="https://cyberskill.world/?utm_source=atlasvn&amp;utm_medium=referral&amp;utm_campaign=attribution" target="_blank" rel="noopener">Made by CyberSkill</a> · <a href="https://github.com/zintaen/vnciv" target="_blank" rel="noopener">Open source · GitHub</a></div></div>
  <a id="attrib-mini" class="attrib-mini" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>© OpenStreetMap</a>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Search results" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Share" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="National report" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" tabindex="-1" role="dialog" aria-modal="true" aria-label="Almanac">
      <button class="close icon-btn" data-close aria-label="Close the Almanac">✕</button>
      <nav id="pedia-nav" aria-label="Almanac pages"></nav>
      <article id="pedia-body" tabindex="0"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">Đang khảo sát đất đai…</div>
